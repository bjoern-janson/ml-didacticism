name: Verify Genesis 1 substrate slice

on:
  push:
    branches: [main]
    paths:
      - scripts/verify_genesis_01_substrate.py
      - .github/workflows/verify-genesis-01.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and extract canonical Genesis 1 records
        run: python scripts/verify_genesis_01_substrate.py

      - name: Commit verification artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/genesis/01_CANONICAL_RECORDS.jsonl verification/genesis/01_CANONICAL_MANIFEST.json
          if git diff --cached --quiet; then
            echo "Verification artifacts already current."
            exit 0
          fi
          git commit -m "Verify canonical Genesis 1 substrate slice"
          git push
